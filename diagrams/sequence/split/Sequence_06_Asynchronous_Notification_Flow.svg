e="stroke: #A80036; stroke-width: 1.0;" x1="614.5" x2="1001.5" y1="553.7439" y2="553.7439"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="217" x="621.5" y="547.9349">Update notification status to FAILED</text><polygon fill="#A80036" points="625.5,581.4499,615.5,585.4499,625.5,589.4499,621.5,585.4499" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="619.5" x2="1006.5" y1="585.4499" y2="585.4499"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="92" x="631.5" y="579.6409">Status updated</text><polygon fill="#A80036" points="351.5,613.1559,341.5,617.1559,351.5,621.1559,347.5,617.1559" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="345.5" x2="613.5" y1="617.1559" y2="617.1559"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="250" x="357.5" y="611.3469">Publish NotificationRetryRequested event</text><!--MD5=[72ccda34f9e304c82b03a3f14062af6b]
@startuml
title Sequence Diagram 06 - Asynchronous Notification Flow

actor "Customer" as Customer
participant "Ticket Service" as Ticket
queue "Message Broker\nRabbitMQ / Kafka" as Broker
participant "Notification Service" as Notification
participant "SMS Provider" as SmsProvider
participant "Email Provider" as EmailProvider
database "PostgreSQL" as DB

Ticket -> Broker: Publish TicketIssued event
Broker -> Notification: Deliver TicketIssued event

Notification -> DB: Save notification with PENDING status
DB - -> Notification: Notification saved

Notification -> SmsProvider: Send SMS confirmation
SmsProvider - -> Notification: SMS delivery result

Notification -> EmailProvider: Send email with ticket
EmailProvider - -> Notification: Email delivery result

alt SMS and Email sent successfully
    Notification -> DB: Update notification status to SENT
    DB - -> Notification: Status updated
    Notification - -> Customer: Receive SMS / Email confirmation
else Notification failed
    Notification -> DB: Update notification status to FAILED
    DB - -> Notification: Status updated
    Notification -> Broker: Publish NotificationRetryRequested event
end

@enduml

