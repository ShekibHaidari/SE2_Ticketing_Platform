link User to UserStatus--><path d="M139.12,394.7658 C180.6,427.4858 233.4,469.1358 271.59,499.2558 " fill="none" id="User-&gt;UserStatus" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="275.7,502.4958,271.1126,493.7806,271.7749,499.3986,266.1569,500.0608,275.7,502.4958" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[2041f589604ba45375e928bb36456261]
@startuml
title Class Diagram 02 - Identity and Access

left to right direction
skinparam shadowing false
skinparam classAttributeIconSize 0

class User {
  +id: UUID
  +fullName: String
  +email: String
  +phoneNumber: String
  +passwordHash: String
  +role: UserRole
  +status: UserStatus
  +createdAt: DateTime

  +login()
  +logout()
  +updateProfile()
}

class OrganizerProfile {
  +id: UUID
  +companyName: String
  +businessEmail: String
  +isVerified: Boolean
  +verifiedAt: DateTime

  +createEvent()
  +viewDashboard()
}

class AdminActionLog {
  +id: UUID
  +actionType: String
  +description: String
  +createdAt: DateTime
}

enum UserRole {
  CUSTOMER
  ORGANIZER
  ADMIN
}

enum UserStatus {
  PENDING
  ACTIVE
  SUSPENDED
}

User "1" - - "0..1" OrganizerProfile : has
User "1" - - "0..*" AdminActionLog : performs

User - -> UserRole
User - -> UserStatus

@enduml

